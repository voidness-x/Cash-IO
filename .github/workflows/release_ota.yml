name: Release — Android APK, iOS IPA & Signed OTA Publisher

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Semantic version tag (e.g. v3.0.0 or v3.1.0)'
        required: true
        default: 'v3.0.0'

permissions:
  contents: write

jobs:
  prepare-metadata:
    name: Parse Semantic Version & Run Pre-Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
      date: ${{ steps.meta.outputs.date }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Flutter Toolchain (Pinned 3.47.8)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: 'stable'
          cache: true

      - name: Run Static Analysis & Security Test Gate
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --fatal-warnings
          flutter test --concurrency=1

      - name: Compute Version & Monotonic Build Number
        id: meta
        run: |
          RAW_TAG="${{ github.event_name == 'workflow_dispatch' && inputs.version_tag || github.ref_name }}"
          CLEAN_VER="${RAW_TAG#v}"
          BASE_VER="${CLEAN_VER%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VER"
          BUILD_NUM=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          REL_DATE=$(date -u +"%Y-%m-%d")
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$CLEAN_VER" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD_NUM" >> "$GITHUB_OUTPUT"
          echo "date=$REL_DATE" >> "$GITHUB_OUTPUT"

  build-android-and-web:
    name: Build Signed Android APK & Web Bundle
    needs: prepare-metadata
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Toolchain (Pinned 3.47.8)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: 'stable'
          cache: true

      - name: Restore Persistent Android Release Signing Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cashio-release.jks"
            echo "CASHIO_KEYSTORE_PATH=$RUNNER_TEMP/cashio-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build Signed Android Release APK & Web PWA Bundle
        env:
          CASHIO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CASHIO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CASHIO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          mkdir -p dist-android

          flutter build apk --release --no-tree-shake-icons \
            --build-name="${{ needs.prepare-metadata.outputs.version }}" \
            --build-number="${{ needs.prepare-metadata.outputs.build }}" \
            --dart-define="CASHIO_APP_VERSION=${{ needs.prepare-metadata.outputs.version }}" \
            --dart-define="CASHIO_BUILD_NUMBER=${{ needs.prepare-metadata.outputs.build }}"

          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist-android/cashio-${{ needs.prepare-metadata.outputs.tag }}-android.apk"

          flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons \
            --build-name="${{ needs.prepare-metadata.outputs.version }}" \
            --build-number="${{ needs.prepare-metadata.outputs.build }}" \
            --dart-define="CASHIO_APP_VERSION=${{ needs.prepare-metadata.outputs.version }}" \
            --dart-define="CASHIO_BUILD_NUMBER=${{ needs.prepare-metadata.outputs.build }}"

          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist-android/cashio-${{ needs.prepare-metadata.outputs.tag }}-android-arm64.apk"

          # Ensure v1 (JAR) + v2 + v3 signature schemes and verify Android manifest installability
          APKSIGNER_BIN=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort -V | tail -n 1)
          AAPT2_BIN=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name aapt2 | sort -V | tail -n 1)
          for APK_CANDIDATE in "dist-android/cashio-${{ needs.prepare-metadata.outputs.tag }}-android.apk" "dist-android/cashio-${{ needs.prepare-metadata.outputs.tag }}-android-arm64.apk"; do
            if [ -n "${CASHIO_KEYSTORE_PATH:-}" ] && [ -f "$CASHIO_KEYSTORE_PATH" ]; then
              "$APKSIGNER_BIN" sign \
                --ks "$CASHIO_KEYSTORE_PATH" \
                --ks-pass env:CASHIO_KEYSTORE_PASSWORD \
                --ks-key-alias "$CASHIO_KEY_ALIAS" \
                --key-pass env:CASHIO_KEY_PASSWORD \
                --v1-signing-enabled true \
                --v2-signing-enabled true \
                --v3-signing-enabled true \
                "$APK_CANDIDATE"
            fi
            SIG_OUT=$("$APKSIGNER_BIN" verify --verbose "$APK_CANDIDATE")
            echo "$SIG_OUT"
            echo "$SIG_OUT" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true"
            echo "$SIG_OUT" | grep -q "Verified using v3 scheme (APK Signature Scheme v3): true"
            BADGE_OUT=$("$AAPT2_BIN" dump badging "$APK_CANDIDATE")
            echo "$BADGE_OUT" | grep -q "targetSdkVersion:'34'"
            if echo "$BADGE_OUT" | grep -q "REQUEST_INSTALL_PACKAGES"; then
              echo "ERROR: Play Protect dropper permission detected!"
              exit 1
            fi
          done

          flutter build web --release --no-tree-shake-icons \
            --build-name="${{ needs.prepare-metadata.outputs.version }}" \
            --build-number="${{ needs.prepare-metadata.outputs.build }}" \
            --dart-define="CASHIO_APP_VERSION=${{ needs.prepare-metadata.outputs.version }}" \
            --dart-define="CASHIO_BUILD_NUMBER=${{ needs.prepare-metadata.outputs.build }}"
          cp web/sqlite3.wasm build/web/ || true
          cp web/sqflite_sw.js build/web/ || true
          test -f build/web/index.html
          test -f build/web/main.dart.js
          test -f build/web/sqlite3.wasm
          (cd build/web && zip -qr "../../dist-android/cashio-${{ needs.prepare-metadata.outputs.tag }}-web.zip" .)

      - name: Shred Temporary Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/cashio-release.jks"

      - name: Upload Android & Web Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-android-web
          path: dist-android/*
          retention-days: 7

  build-ios-ipa:
    name: Build iOS Unsigned Release IPA (macOS Xcode)
    needs: prepare-metadata
    runs-on: macos-15-intel
    continue-on-error: true
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Flutter Toolchain (Pinned 3.47.8)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: 'stable'
          cache: true

      - name: Build iOS Release (--no-codesign) & Package .ipa
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --no-tree-shake-icons \
            --build-name="${{ needs.prepare-metadata.outputs.version }}" \
            --build-number="${{ needs.prepare-metadata.outputs.build }}" \
            --dart-define="CASHIO_APP_VERSION=${{ needs.prepare-metadata.outputs.version }}" \
            --dart-define="CASHIO_BUILD_NUMBER=${{ needs.prepare-metadata.outputs.build }}"

          mkdir -p Payload dist-ios
          cp -R build/ios/iphoneos/Runner.app Payload/
          test -f Payload/Runner.app/Runner
          test -f Payload/Runner.app/Info.plist
          zip -qry "dist-ios/cashio-${{ needs.prepare-metadata.outputs.tag }}-ios-unsigned.ipa" Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: dist-ios/*
          retention-days: 7

  publish-github-release:
    name: Sign SHA-256 OTA Manifest & Publish GitHub Release
    needs: [prepare-metadata, build-android-and-web, build-ios-ipa]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download All Built Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-bundle
          merge-multiple: true

      - name: Compute SHA-256 Digests & Generate OTA manifest.json
        env:
          TAG: ${{ needs.prepare-metadata.outputs.tag }}
          VER: ${{ needs.prepare-metadata.outputs.version }}
          BUILD: ${{ needs.prepare-metadata.outputs.build }}
          REL_DATE: ${{ needs.prepare-metadata.outputs.date }}
          REPO: ${{ github.repository }}
          SHA_COMMIT: ${{ github.sha }}
        run: |
          cd release-bundle
          APK_FILE="cashio-${TAG}-android.apk"
          APK_ARM64_FILE="cashio-${TAG}-android-arm64.apk"
          IOS_FILE="cashio-${TAG}-ios-unsigned.ipa"
          WEB_FILE="cashio-${TAG}-web.zip"

          APK_SHA=$(sha256sum "$APK_FILE" | awk '{print $1}')
          APK_ARM64_SHA=$(sha256sum "$APK_ARM64_FILE" | awk '{print $1}')
          WEB_SHA=$(sha256sum "$WEB_FILE" | awk '{print $1}')
          SHORT_SHA="${SHA_COMMIT:0:7}"
          BASE_DL="https://github.com/${REPO}/releases/download/${TAG}"

          if [ -f "$IOS_FILE" ]; then
            IOS_SHA=$(sha256sum "$IOS_FILE" | awk '{print $1}')
            IOS_URL="${BASE_DL}/${IOS_FILE}"
          else
            IOS_SHA=""
            IOS_URL=""
          fi

          jq -n \
            --arg ver "$VER" \
            --argjson build "$BUILD" \
            --arg rel_date "$REL_DATE" \
            --arg title "Cash-IO ${TAG} Official Mobile & Web Release" \
            --arg commit "$SHORT_SHA" \
            --arg apk_sha "$APK_SHA" \
            --arg apk_arm64_sha "$APK_ARM64_SHA" \
            --arg ios_sha "$IOS_SHA" \
            --arg web_sha "$WEB_SHA" \
            --arg apk_url "${BASE_DL}/${APK_FILE}" \
            --arg apk_arm64_url "${BASE_DL}/${APK_ARM64_FILE}" \
            --arg ios_url "$IOS_URL" \
            --arg web_url "${BASE_DL}/${WEB_FILE}" \
            --arg rel_url "https://github.com/${REPO}/releases/tag/${TAG}" \
            '{
              version: $ver,
              build_number: $build,
              release_date: $rel_date,
              title: $title,
              changelog: [
                ("Native Fingerprint / Biometric Sign-In + 6-Digit PIN protection (" + $commit + ")."),
                "De-cluttered Dashboard & 100% overflow-free responsive mobile cards.",
                "Guided Starting Cash, Bank Balance & Starter Budgets onboarding + Quick Setup.",
                "Play-Protect-compliant APK upgrade with pre-update .cashio.bak snapshot."
              ],
              sha256_checksum: $apk_sha,
              is_emergency_patch: false,
              download_url: $apk_url,
              apk_download_url: $apk_url,
              apk_sha256_checksum: $apk_sha,
              apk_arm64_download_url: $apk_arm64_url,
              apk_arm64_sha256_checksum: $apk_arm64_sha,
              ios_download_url: $ios_url,
              ios_sha256_checksum: $ios_sha,
              web_download_url: $web_url,
              web_sha256_checksum: $web_sha,
              release_page_url: $rel_url
            }' > manifest.json

          if [ -f "$IOS_FILE" ]; then
            sha256sum "$APK_FILE" "$APK_ARM64_FILE" "$IOS_FILE" "$WEB_FILE" manifest.json > SHA256SUMS.txt
          else
            sha256sum "$APK_FILE" "$APK_ARM64_FILE" "$WEB_FILE" manifest.json > SHA256SUMS.txt
          fi
          cat manifest.json
          cat SHA256SUMS.txt

      - name: Upload Signed Bundle Artifacts to Run
        uses: actions/upload-artifact@v4
        with:
          name: cashio-complete-release-${{ needs.prepare-metadata.outputs.tag }}
          path: release-bundle/*
          retention-days: 30

      - name: Publish APK, iOS IPA & OTA Manifest to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-metadata.outputs.tag }}
        run: |
          cat > release-notes.md <<EOF
          ### Installable Release Packages (\`${TAG}\`)

          - **Android Universal APK (Recommended — All Android 7–16 Phones & Tablets):** \`cashio-${TAG}-android.apk\`
          - **Android Slim 64-bit APK (Fastest Download for Modern Phones):** \`cashio-${TAG}-android-arm64.apk\`
            - Signed with persistent RSA-4096 \`v1 + v2 + v3\` signature schemes (\`targetSdk 34\`, Play-Protect compliant) for clean installation and seamless in-place OTA upgrades.
            - Includes Native Fingerprint / Biometric Sign-In, Guided Starting Cash Setup, and 100% overflow-free responsive mobile UI.
            - Automatically checks GitHub Releases on app launch/resume, saves a \`.cashio.bak\` emergency vault snapshot, and triggers Android's system updater whenever a newer GitHub Release is published.
          - **iOS (Unsigned Sideloadable Archive for AltStore / SideStore / Sideloadly):** \`cashio-${TAG}-ios-unsigned.ipa\`
          - **Web / PWA Bundle (Persistent IndexedDB + WASM SQLite):** \`cashio-${TAG}-web.zip\`
          - **OTA Manifest & Checksums:** \`manifest.json\` & \`SHA256SUMS.txt\`
          EOF

          ASSETS=(
            "release-bundle/cashio-${TAG}-android.apk"
            "release-bundle/cashio-${TAG}-android-arm64.apk"
            "release-bundle/cashio-${TAG}-web.zip"
            "release-bundle/manifest.json"
            "release-bundle/SHA256SUMS.txt"
          )
          if [ -f "release-bundle/cashio-${TAG}-ios-unsigned.ipa" ]; then
            ASSETS+=("release-bundle/cashio-${TAG}-ios-unsigned.ipa")
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Cash-IO ${TAG} — Android APK, iOS IPA & OTA Release" \
              --notes-file release-notes.md
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "Cash-IO ${TAG} — Android APK, iOS IPA & OTA Release" \
              --notes-file release-notes.md \
              --generate-notes
          fi
