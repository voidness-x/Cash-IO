name: cash_io
description: "Air-gapped, zero-knowledge double-entry personal finance ledger with encrypted multi-vault enclaves, on-device heuristics, and self-healing OTA updates."
publish_to: 'none'
repository: https://github.com/voidness-x/Cash-IO
issue_tracker: https://github.com/voidness-x/Cash-IO/issues

version: 3.0.0+300

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.3
  sqflite: ^2.4.6
  sqflite_common_ffi: ^2.4.7
  path_provider: ^2.1.6
  path: ^1.9.1
  image_picker: ^1.1.2
  sqflite_common_ffi_web: ^1.2.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
