[package]
name = "cashio_core"
version = "3.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/voidness-x/Cash-IO"
authors = ["voidness-x <141596698+voidness-x@users.noreply.github.com>"]
description = "High-performance, zero-knowledge, offline-first accounting and CRDT sync engine."

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
argon2 = "0.5"
aes-gcm = "0.10"
bip39 = "2.0"
zeroize = { version = "1.8", features = ["derive"] }
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = { version = "0.2", features = ["js"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"

[dev-dependencies]
proptest = "1.4"
